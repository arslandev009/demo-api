name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (docqa and llm-client come from GitHub at the pinned commits)
        run: pip install -r requirements.txt pytest httpx
      - name: Smoke tests
        run: pytest -q